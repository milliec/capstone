<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regulatory Intelligence: gates and approvals</title>
  <!-- Font source: system (AAMAD draw-diagram skill). No web font link. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1360px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Secure paved road · Diagram Design</p>
    <h1>Regulatory Intelligence: gates and approvals</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gates-title gates-desc">
        <title id="gates-title">Regulatory Intelligence: gates and approvals</title>
        <desc id="gates-desc">Only the specialist's requests reach gate state: starting a run, gate decisions and abandoning a run (only while it waits at G1, G2 or G3) pass server-side role and version checks, which append every refusal to the audit log, into the gate service, which alone changes gate state, approvals and versions and appends to the audit log, while the stage functions and agents may only return drafts and are blocked from writing state, and the GP may only read the published calendar and is blocked from writing.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Trust boundary: the only path to state (security treatment, dashed) -->
        <rect x="296" y="104" width="688" height="456" rx="8" fill="rgba(191,69,32,0.03)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="584" y="108" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ONLY PATH TO STATE</text>

        <!-- Permitted paths (behind boxes) -->
        <!-- Specialist -> server checks: start run, decisions, abandon (at a gate only), each with the version seen -->
        <line x1="216" y1="184" x2="328" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Server checks -> gate service: allowed -->
        <line x1="504" y1="184" x2="600" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Server checks -> audit log: refusals at the role and version checks, same append path -->
        <line x1="416" y1="216" x2="416" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Gate service -> business data: gate state and versions -->
        <line x1="760" y1="232" x2="760" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Gate service -> audit log: append (down, then left) -->
        <path d="M 632,232 V 344 Q 632,352 624,352 H 504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Gate service -> stage functions: start a stage -->
        <line x1="808" y1="168" x2="1064" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Stage functions -> gate service: drafts only (dashed return) -->
        <line x1="1064" y1="200" x2="808" y2="200" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Business data -> GP read model: published only -->
        <line x1="800" y1="384" x2="800" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- GP read model -> GP: published calendar only -->
        <line x1="696" y1="472" x2="216" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Blocked paths: dashed, ending in a stop bar before the boundary -->
        <!-- Stage functions and agents -/-> state -->
        <path d="M 1152,216 V 344 Q 1152,352 1144,352 H 996" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="2,3"/>
        <line x1="992" y1="342" x2="992" y2="362" stroke="#2d3142" stroke-width="2.4"/>
        <!-- GP -/-> any write -->
        <path d="M 160,440 V 360 Q 160,352 168,352 H 280" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="2,3"/>
        <line x1="284" y1="342" x2="284" y2="362" stroke="#2d3142" stroke-width="2.4"/>

        <!-- Path labels (opaque masks, 8px from their lines, clear of every node) -->
        <!-- Stacked label: one line per request; centred in the gap left of the boundary -->
        <rect x="228" y="136" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="145" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">START RUN</text>
        <rect x="228" y="150" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DECISIONS</text>
        <rect x="234" y="164" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ABANDON</text>

        <rect x="424" y="262" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="452" y="271" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REFUSALS</text>

        <rect x="528" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="552" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ALLOWED</text>

        <rect x="768" y="270" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="800" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE STATE</text>

        <rect x="540" y="332" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APPEND</text>

        <rect x="860" y="148" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="896" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">START STAGE</text>

        <rect x="872" y="208" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="896" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DRAFTS</text>

        <rect x="808" y="406" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="836" y="415" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PUBLISHED</text>

        <rect x="412" y="452" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="461" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PUBLISHED ONLY</text>

        <rect x="1044" y="332" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1072" y="341" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO WRITE</text>

        <rect x="184" y="332" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="226" y="341" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WRITE REFUSED</text>

        <!-- Node: Compliance specialist (person) -->
        <rect x="40" y="152" width="176" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="152" width="176" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="160" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="64" y="169" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="128" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Compliance specialist</text>
        <text x="128" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">decides G1 · G2 · G3</text>
        <text x="128" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">abandons at a gate only</text>

        <!-- Node: GP / fund manager (person) -->
        <rect x="40" y="440" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="440" width="176" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="448" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="64" y="457" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="128" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GP / fund manager</text>
        <text x="128" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">read-only</text>

        <!-- Node: Server checks (role and version) -->
        <rect x="328" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="328" y="152" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="336" y="160" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="354" y="169" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CHECK</text>
        <text x="416" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Server checks</text>
        <text x="416" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">role · version seen</text>

        <!-- Node: Gate service (privileged gate, focal) -->
        <rect x="600" y="136" width="208" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="136" width="208" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="608" y="144" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="624" y="153" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="704" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gate service</text>
        <text x="704" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">G1 · G2 · G3 decisions</text>
        <text x="704" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">refuses · records</text>

        <!-- Node: Stage functions and agents -->
        <rect x="1064" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="1064" y="152" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1072" y="160" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="1088" y="169" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STAGE</text>
        <text x="1152" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stages and agents</text>
        <text x="1152" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">draft only · no tools</text>

        <!-- Node: Audit log -->
        <rect x="328" y="320" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="328" y="320" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="336" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="350" y="337" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
        <text x="416" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Audit log</text>
        <text x="416" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">decisions · refusals</text>

        <!-- Node: Business data -->
        <rect x="696" y="320" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="320" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="704" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="718" y="337" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="800" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Business data</text>
        <text x="800" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rows · verdicts · versions</text>

        <!-- Node: GP read model -->
        <rect x="696" y="440" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="440" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="448" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="720" y="457" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>
        <text x="800" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GP read model</text>
        <text x="800" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">published only</text>

        <!-- Callout -->
        <text x="328" y="540" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Hiding a button is not enforcement: every write is checked on the server (CR-004)</text>

        <!-- Legend strip -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="672" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Privileged gate</text>

        <rect x="164" y="672" width="14" height="10" rx="2" fill="rgba(191,69,32,0.03)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="184" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Trust boundary</text>

  </div>
