<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
        <title id="pipeline-title">Regulatory Intelligence: agent pipeline</title>
        <desc id="pipeline-desc">The MVP pipeline in three stages: in stage A the extractor agent drafts rows, the code quote check (a failed row cannot be approved, only rejected) and the verifier agent check them and a code coverage view lists uncited paragraphs before gate G1; in stage B the judge agent drafts verdicts before gate G2; in stage C code calculates the dates before gate G3, with a specialist deciding at every gate.</desc>
        <defs>
      <style>#pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pipeline-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones: one per stage -->
        <rect x="40" y="96" width="872" height="272" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="680" y="100" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE A · EXTRACT, VERIFY</text>

        <rect x="40" y="424" width="256" height="136" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="196" y="428" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="437" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE B · JUDGE</text>

        <rect x="544" y="424" width="256" height="136" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="624" y="428" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="437" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE C · DATES</text>

        <!-- Arrows (behind boxes) -->
        <!-- Extractor -> quote check: rows -->
        <line x1="248" y1="168" x2="320" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <!-- Extractor -> coverage view: rows (right, down, right) -->
        <path d="M 248,200 H 276 Q 284,200 284,208 V 292 Q 284,300 292,300 H 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <!-- Quote check -> verifier: checked rows -->
        <line x1="496" y1="180" x2="568" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <!-- Verifier -> G1: rows with flags -->
        <line x1="744" y1="180" x2="968" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <!-- Coverage view -> G1: gaps (right, then up into G1's bottom edge) -->
        <path d="M 496,300 H 1040 Q 1048,300 1048,292 V 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <!-- G1 -> judge: approved rows (right, down, left along the gap between rows, down into the judge) -->
        <path d="M 1120,180 H 1192 Q 1200,180 1200,188 V 404 Q 1200,412 1192,412 H 176 Q 168,412 168,420 V 456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <!-- Judge -> G2: verdicts -->
        <line x1="248" y1="492" x2="344" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <!-- G2 -> date engine: decided verdicts -->
        <line x1="496" y1="492" x2="576" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <!-- Date engine -> G3: calendar -->
        <line x1="752" y1="492" x2="848" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>

        <!-- Arrow labels (opaque masks, 8px from their lines, clear of every node) -->
        <rect x="268" y="148" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="284" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROWS</text>

        <rect x="292" y="244" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="308" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROWS</text>

        <rect x="508" y="160" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="532" y="169" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CHECKED</text>

        <rect x="836" y="160" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="856" y="169" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FLAGS</text>

        <rect x="624" y="280" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GAPS</text>

        <rect x="612" y="392" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="401" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APPROVED</text>

        <rect x="268" y="472" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="296" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VERDICTS</text>

        <rect x="512" y="472" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="536" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DECIDED</text>

        <rect x="772" y="472" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="800" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CALENDAR</text>

        <!-- Node: Extractor (agent) -->
        <rect x="72" y="144" width="176" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="144" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="80" y="152" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="98" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="160" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Extractor</text>
        <text x="160" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cheaper model</text>
        <text x="160" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in: one document</text>

        <!-- Node: Quote check (code, focal: a failed row cannot be approved, only rejected). Height 84 for a third sublabel line -->
        <rect x="320" y="144" width="176" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="144" width="176" height="84" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="328" y="152" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="344" y="161" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
        <text x="408" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Quote check</text>
        <text x="408" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">word for word · QN-1</text>
        <text x="408" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">blocks approval;</text>
        <text x="408" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">row must be rejected</text>

        <!-- Node: Verifier (agent) -->
        <rect x="568" y="144" width="176" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="144" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="576" y="152" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="594" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="656" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Verifier</text>
        <text x="656" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mid-tier model</text>
        <text x="656" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in: row + sources</text>

        <!-- Node: Coverage view (code) -->
        <rect x="320" y="264" width="176" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="264" width="176" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="328" y="272" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="344" y="281" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
        <text x="408" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Coverage view</text>
        <text x="408" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">uncited paragraphs</text>
        <text x="408" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no answer key</text>

        <!-- Node: G1 (human gate) -->
        <rect x="968" y="144" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="968" y="144" width="152" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="976" y="152" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="992" y="161" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="1044" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">G1 · rules</text>
        <text x="1044" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">specialist</text>
        <text x="1044" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">approve · reject</text>

        <!-- Node: Judge (agent) -->
        <rect x="80" y="456" width="168" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="456" width="168" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="88" y="464" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="106" y="473" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="164" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Judge</text>
        <text x="164" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reasoning model</text>
        <text x="164" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in: row + fund facts</text>

        <!-- Node: G2 (human gate) -->
        <rect x="344" y="456" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="456" width="152" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="352" y="464" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="368" y="473" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="420" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">G2 · verdicts</text>
        <text x="420" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">specialist</text>
        <text x="420" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">confirm · override</text>

        <!-- Node: Date engine (code) -->
        <rect x="576" y="456" width="176" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="456" width="176" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="584" y="464" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="600" y="473" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
        <text x="664" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Date engine</text>
        <text x="664" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">conventions D-1 to D-7</text>
        <text x="664" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no model</text>

        <!-- Node: G3 (human gate) -->
        <rect x="848" y="456" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="456" width="152" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="856" y="464" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="872" y="473" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="924" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">G3 · publish</text>
        <text x="924" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">specialist</text>
        <text x="924" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">publish · decline</text>

        <!-- Callouts (2 max) -->
        <text x="568" y="248" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">The verifier gets the row and sources, never the extractor's reasoning (W-05)</text>
        <text x="544" y="600" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">No agent has a tool: code builds every input from stored data (CR-002)</text>

        <!-- Legend strip -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="672" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Agent (model step)</text>

        <rect x="196" y="672" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="216" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Code step (no model)</text>

        <rect x="364" y="672" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="384" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Code authority: blocks approval</text>

        <rect x="556" y="672" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="576" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Gate: the specialist decides</text>

        <rect x="772" y="672" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <text x="792" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Stage (one stage function)</text>

        <line x1="972" y1="678" x2="1000" y2="678" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <text x="1008" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Hand-off</text>
      </svg>
