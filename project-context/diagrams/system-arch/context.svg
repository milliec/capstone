<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-title context-desc" id="context-root">
        <title id="context-title">Regulatory Intelligence: system context</title>
        <desc id="context-desc">The compliance specialist runs the system and decides at gates G1 to G3, the GP reads only the published calendar, and the system reads mock data and configuration files and calls the OpenAI API as its only live external service.</desc>
        <defs>
      <style>#context-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #context-root { font-family: var(--font-sans); color: var(--color-ink); }
      #context-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#context-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="context-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="context-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="context-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes). All four run straight: each pair of ends shares a y. -->
        <!-- Specialist -> system: runs the system and decides at G1-G3 -->
        <line x1="216" y1="180" x2="340" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>
        <!-- GP -> system: reads the published calendar only -->
        <line x1="216" y1="260" x2="340" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>
        <!-- System -> OpenAI API: model calls (external HTTPS) -->
        <line x1="556" y1="180" x2="660" y2="180" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#context-arrow-link)"/>
        <!-- Mock data and configuration -> system: read -->
        <line x1="660" y1="260" x2="556" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>

        <!-- Arrow labels: opaque masks, 8px above their lines, clear of every node -->
        <rect x="240" y="160" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="278" y="169" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RUN · DECIDE</text>

        <rect x="234" y="240" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="278" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READ PUBLISHED</text>

        <rect x="572" y="160" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="608" y="169" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL CALLS</text>

        <rect x="592" y="240" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="608" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>

        <!-- Node: Compliance specialist (person / input) -->
        <rect x="40" y="148" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="148" width="176" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="156" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="64" y="165" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="128" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Compliance specialist</text>
        <text x="128" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">runs · reviews · decides</text>

        <!-- Node: GP / fund manager (person / input) -->
        <rect x="40" y="228" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="228" width="176" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="236" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="64" y="245" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="128" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GP / fund manager</text>
        <text x="128" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">read-only</text>

        <!-- Node: Regulatory Intelligence system (focal) -->
        <rect x="340" y="140" width="216" height="160" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="140" width="216" height="160" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="348" y="148" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="362" y="157" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SYS</text>
        <text x="448" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Regulatory Intelligence</text>
        <text x="448" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pages · backend · gates</text>
        <text x="448" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3 agents · code steps</text>

        <!-- Node: OpenAI API (external service) -->
        <rect x="660" y="148" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="148" width="176" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="668" y="156" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="682" y="165" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="748" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenAI API</text>
        <text x="748" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">only live service</text>

        <!-- Node: Mock data and configuration (store / files) -->
        <rect x="660" y="228" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="228" width="176" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="668" y="236" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="684" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FILES</text>
        <text x="748" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Mock data and config</text>
        <text x="748" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sources · fund · holidays</text>

        <!-- Legend strip -->
        <line x1="40" y1="324" x2="920" y2="324" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="356" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="364" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">This system</text>

        <rect x="156" y="356" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="176" y="364" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Person (mocked role)</text>

        <rect x="300" y="356" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="320" y="364" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External service</text>

        <rect x="432" y="356" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="452" y="364" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Files (mock data, config)</text>

        <line x1="588" y1="362" x2="616" y2="362" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#context-arrow-link)"/>
        <text x="624" y="364" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External API call</text>

        <line x1="736" y1="362" x2="764" y2="362" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>
        <text x="772" y="364" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Use or read</text>
      </svg>
