# CI: the shared backstop for every pull request (sad.md §5 "CI"; B1 follow-up; handoff H-003).
#
# What it runs, with stand-in agents only (no model is ever called, SD NFR-011):
#   1. Lint with ruff (version pinned in requirements-dev.txt, settings in pyproject.toml).
#      Formatting is NOT checked yet (operator, 2026-11-19).
#   2. Tier 1 tests: they BLOCK the merge (sad.md §9 "Test tiers", DL-42).
#   3. Tier 2 tests: they run and report, but do not block until promoted (§9).
#   4. aamad validate (H-003), the same rule as the git hook: every [ERROR] blocks.
#
# What it must NEVER do (this repository is public; CLAUDE.md, H-003):
#   - run the real-name scan: its identifier list lives in the git-ignored reference/ folder and
#     must never reach GitHub, as a file or a secret. The scan stays on the operator's machine.
#   - hold a model key. There is no OPENAI_API_KEY here, and AGENTS_MODE is stand_in.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read          # read the code; nothing else

concurrency:              # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTS_MODE: stand_in          # never a real model (CR-030)
      STAND_IN_UNIT_PAUSE_S: "0"     # tests set this too; no pause in CI
      # CrewAI's outside connections off (B3 step 7b). The code forces these too
      # (backend/runtime/crewai_setup.py); set here so nothing in CI ever reaches out.
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      CREWAI_TRACING_ENABLED: "false"
      CREWAI_DISABLE_VERSION_CHECK: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the app, test and dev dependencies (pinned)
        run: pip install -e ".[test]" -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Tier 1 tests (blocking)
        run: pytest -q tests/tier1 tests/test_answer_key.py

      - name: Tier 2 tests (not blocking yet)
        continue-on-error: true
        run: pytest -q tests/tier2

      - name: Framework validator (aamad validate)
        # Same rule as scripts/git-hooks/run-checks.sh: every [ERROR] blocks. (The temporary
        # "qa.md missing" exception, H-002, ended when @qa.eng wrote 2.build/qa.md.)
        run: aamad validate
